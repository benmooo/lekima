[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/benmooo/lekima"
authors = ["benmooo"]
description = "Terminal-native NetEase Cloud Music player, built for vim users and code agents."

[workspace.dependencies]
# internal
lekima-domain = { path = "crates/lekima-domain" }
lekima-core = { path = "crates/lekima-core" }
lekima-config = { path = "crates/lekima-config" }
lekima-ipc = { path = "crates/lekima-ipc" }
lekima-ncm = { path = "crates/lekima-ncm" }
lekima-audio = { path = "crates/lekima-audio" }
lekima-tui = { path = "crates/lekima-tui" }

# external
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
crossterm = "0.29"
directories = "6"
ncmapi = "1.1"
qrcode = "0.14"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "socks"] }
rodio = { version = "0.23", features = ["tracing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
