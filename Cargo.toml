[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/benmooo/lekima"
authors = ["benmooo"]

[workspace.dependencies]
# internal
lekima-domain = { path = "crates/lekima-domain", version = "0.7.0" }
lekima-core = { path = "crates/lekima-core", version = "0.7.0" }
lekima-config = { path = "crates/lekima-config", version = "0.7.0" }
lekima-ipc = { path = "crates/lekima-ipc", version = "0.7.0" }
lekima-ncm = { path = "crates/lekima-ncm", version = "0.7.0" }
lekima-audio = { path = "crates/lekima-audio", version = "0.7.0" }
lekima-platform = { path = "crates/lekima-platform", version = "0.3.0" }
lekima-tui = { path = "crates/lekima-tui", version = "0.7.0" }

# external
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
crossterm = "0.29"
directories = "6"
getrandom = "0.3"
ncmapi = "1.8"
qrcode = "0.14"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "socks"] }
rodio = { version = "0.23", features = ["tracing"] }
rustfft = "6"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
