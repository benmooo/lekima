[package]
name = "lekima-platform"
description = "Operating-system media integration (MPRIS, Now Playing) for lekima."
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.11", features = ["tokio"] }
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
serde.workspace = true
serde_json.workspace = true
block2 = { version = "0.6", features = ["alloc"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary"] }
objc2-media-player = { version = "0.3", default-features = false, features = [
  "std",
  "MediaPlayerDefines",
  "MPMediaItem",
  "MPNowPlayingInfoCenter",
  "MPRemoteCommand",
  "MPRemoteCommandCenter",
  "MPRemoteCommandEvent",
  "MPRemoteControlTypes",
  "block2",
] }
